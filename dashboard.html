<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIMAP - Dashboard de usuario">
    <title>SIMAP - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="fondo-verde">
    <div class="container py-4">
        <div class="text-end mb-3">
            <button class="btn btn-light btn-sm" onclick="cerrarSesion()" title="Cerrar sesión">
                Cerrar sesión
            </button>
        </div>

        <div class="text-center mt-4">
            <img src="img/user.png" alt="Foto de perfil" class="perfil mb-3">

            <div class="info-box mt-4">
                <div class="mb-3">
                    <label for="grado" class="form-label">Grado</label>
                    <input type="text" id="grado" class="form-control" value="Capitán" readonly>
                </div>

                <div class="mb-3">
                    <label for="nombres" class="form-label">Nombres</label>
                    <input type="text" id="nombres" class="form-control" value="Sergio Peña" readonly>
                </div>

                <div class="mb-4">
                    <label for="cargo" class="form-label">Cargo</label>
                    <input type="text" id="cargo" class="form-control" value="Piloto" readonly>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="ordenes.html" class="btn btn-light" title="Ver órdenes de vuelo">
                    Órdenes de Vuelo
                </a>

                <a href="registros.html" class="btn btn-light" title="Ver registros de vuelo">
                    Registros de Vuelo
                </a>
            </div>

            <div class="mt-4">
                <a href="https://youtu.be/GS5xs1w9Bls" target="_blank" class="btn btn-light btn-lg" title="Ver video de capacitación">
                    📹 Ver Video
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
