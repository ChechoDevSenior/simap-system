<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIMAP - Sistema de Información de Movimiento Aéreo de Personal">
    <title>SIMAP - Inicio de Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center fondo-verde">
        <div class="login-box text-center">
            <img src="img/logo.png" alt="Logo SIMAP" class="logo mb-4">
            
            <h1 class="titulo">Inicio de Sesión</h1>
            
            <form id="loginForm" name="loginForm">
                <div class="mb-3 text-start">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        class="form-control" 
                        placeholder="Ingresa tu usuario"
                        required>
                    <small class="text-danger" id="usuarioError"></small>
                </div>

                <div class="mb-3 text-start">
                    <label for="password" class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Ingresa tu contraseña"
                        required>
                    <small class="text-danger" id="passwordError"></small>
                </div>

                <button type="submit" class="btn btn-light w-100 mb-3">
                    Ingresar
                </button>

                <a href="recuperar.html" class="link-light text-decoration-none">
                    ¿Olvidaste tu contraseña?
                </a>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
