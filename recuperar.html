<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIMAP - Recuperar contraseña">
    <title>SIMAP - Recuperar Contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="fondo-verde">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="login-box text-center">
            <a href="index.html" class="btn btn-light btn-sm mb-4" title="Volver al inicio de sesión">
                ← Atrás
            </a>

            <h1 class="titulo mb-4">Recuperar Contraseña</h1>

            <form id="recuperarForm" name="recuperarForm">
                <div class="mb-3 text-start">
                    <label for="usuarioRecuperar" class="form-label text-white">
                        Usuario institucional
                    </label>
                    <input 
                        type="text" 
                        id="usuarioRecuperar" 
                        name="usuarioRecuperar" 
                        class="form-control" 
                        placeholder="Ingresa tu usuario"
                        required>
                    <small class="text-danger" id="usuarioRecuperarError"></small>
                </div>

                <button type="submit" class="btn btn-light w-100">
                    Recuperar Contraseña
                </button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
